name: Build Wanglab Core Windows Release

on:
  push:
    branches:
      - wanglab/0.2.0-localization
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Cancel superseded builds
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'wanglab-windows.yml',
              branch: context.ref.replace('refs/heads/', ''),
              per_page: 100,
            });
            for (const run of data.workflow_runs) {
              if (run.id !== context.runId && run.run_number < Number(process.env.GITHUB_RUN_NUMBER)
                && ['queued', 'in_progress'].includes(run.status)) {
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
                core.info(`Cancelled superseded run ${run.id}`);
              }
            }

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Test independent model supplier routes
        shell: bash
        run: |
          npm ci --prefix scripts/model-relays --ignore-scripts --no-audit --no-fund
          node --test scripts/model-relays/*.test.mjs

      - name: Install pinned DSH dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile

      - name: Deploy package
        shell: bash
        run: |
          pnpm deploy --filter . --prod build_dir --legacy
          cd build_dir
          npm install --omit=dev

      - name: Apply package patches
        shell: bash
        working-directory: build_dir
        timeout-minutes: 2
        run: |
          node ../scripts/apply-dsh-web-app-patch.mjs
          node ../scripts/apply-wanglab-localization.mjs
          node ../scripts/apply-wanglab-model-discovery.mjs
          node --test ../scripts/model-discovery.test.mjs

      - name: Verify Node 22 native terminal
        shell: bash
        working-directory: build_dir
        timeout-minutes: 2
        run: node --test --test-timeout=60000 ../scripts/smoke-native.mjs

      - name: Verify Core startup
        shell: bash
        working-directory: build_dir
        timeout-minutes: 3
        run: node --test --test-timeout=120000 ../scripts/smoke-core.mjs

      - name: Remove development files
        shell: bash
        working-directory: build_dir
        run: |
          find node_modules -type f \( -name "*.map" -o -name "*.ts" -o -name "*.mts" \) -delete || true
          find node_modules -type d \( -name "test" -o -name "tests" -o -name "benchmark" -o -name "example" -o -name "demo" \) -exec rm -rf {} + || true

      - name: Create Windows archive
        shell: bash
        working-directory: build_dir
        run: |
          7z a ../deepseek-harness-pkg-windows.zip node_modules package.json package-lock.json

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-pkg-windows.zip
          path: deepseek-harness-pkg-windows.zip

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          name: deepseek-harness-pkg-windows.zip
          path: release-assets

      - name: Publish Wanglab Core release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: wanglab-core-dsh-0.1.2-rc.1-desktop-0.3.0
        run: |
          if EXISTING_COMMIT="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish' 2>/dev/null)"; then
            test "$EXISTING_COMMIT" = "$GITHUB_SHA" || { echo 'Refusing to overwrite a release from another commit'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Wanglab Harness Core 0.1.2-rc.1 for Desktop 0.3.0" --notes 'Built with Node 22.22.0 for Desktop 0.3.0. Native terminal and Core startup checks passed before packaging.'
          fi
          gh release upload "$RELEASE_TAG" release-assets/deepseek-harness-pkg-windows.zip --clobber
