name: Build and Pre-release DeepSeek Harness from Source

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '上游 GitHub Release 版本（例如: 0.1.2-alpha.1）'
        required: true
  workflow_call:
    inputs:
      dsh_version:
        description: '上游 GitHub Release 版本'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build from source on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: deepseek-harness-pkg-windows.zip
          - os: macos-latest
            artifact_name: deepseek-harness-pkg-macos-arm64.zip
          - os: macos-15-intel
            artifact_name: deepseek-harness-pkg-macos-x64.zip
          - os: ubuntu-latest
            artifact_name: deepseek-harness-pkg-linux.zip

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Clone upstream release source
        shell: bash
        env:
          DSH_VERSION: ${{ inputs.dsh_version || github.event.inputs.dsh_version }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "dsh-v${DSH_VERSION}" https://github.com/deepseek-ai/deepseek-harness.git upstream

      - name: Configure shippable upstream node_modules layout
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          # deploy otherwise creates junctions/symlinks that cannot safely move
          # between machines inside a zip archive.
          cat >> pnpm-workspace.yaml <<'EOF'

          nodeLinker: hoisted
          shamefullyHoist: true
          publicHoistPattern:
            - '*'
          EOF

      - name: Install upstream dependencies
        shell: bash
        working-directory: upstream
        run: pnpm install

      - name: Build upstream
        shell: bash
        working-directory: upstream
        run: pnpm run build

      - name: Deploy built CLI dependency closure
        shell: bash
        working-directory: upstream
        run: pnpm deploy --filter @deepseek-ai/dsh --prod build_dir --legacy

      - name: Arrange standalone package and command shim
        shell: bash
        working-directory: upstream/build_dir
        env:
          DSH_VERSION: ${{ inputs.dsh_version || github.event.inputs.dsh_version }}
        run: |
          set -euo pipefail
          # pnpm deploy puts the selected package at the deploy root. Move it
          # under node_modules so the result has the same shape as npm builds.
          mkdir -p node_modules/@deepseek-ai/dsh
          if [ -d lib ]; then mv lib node_modules/@deepseek-ai/dsh/lib; fi
          if [ -f package.json ]; then mv package.json node_modules/@deepseek-ai/dsh/package.json; fi
          if [ -f cordis.patch.yml ]; then mv cordis.patch.yml node_modules/@deepseek-ai/dsh/cordis.patch.yml; fi

          mkdir -p node_modules/.bin patches
          cp ../../patches/* patches/ 2>/dev/null || true
          cat > package.json <<EOF
          {
            "name": "deepseek-harness-pkg",
            "version": "${DSH_VERSION}",
            "private": true,
            "description": "Source-built pre-release of DeepSeek Harness"
          }
          EOF

          cat > node_modules/.bin/dsh <<'EOF'
          #!/bin/sh
          basedir=$(dirname "$0")
          exec node "$basedir/../@deepseek-ai/dsh/lib/bin.js" "$@"
          EOF
          chmod +x node_modules/.bin/dsh

          cat > node_modules/.bin/dsh.cmd <<'EOF'
          @ECHO off
          SETLOCAL
          SET "_prog=node"
          "%_prog%" "%~dp0\..\@deepseek-ai\dsh\lib\bin.js" %*
          ENDLOCAL
          EXIT /b %errorlevel%
          EOF

          cat > node_modules/.bin/dsh.ps1 <<'EOF'
          #!/usr/bin/env pwsh
          $basedir = Split-Path $MyInvocation.MyCommand.Definition -Parent
          & node "$basedir/../@deepseek-ai/dsh/lib/bin.js" $args
          exit $LASTEXITCODE
          EOF

      - name: Apply dsh-web-app patch
        shell: bash
        working-directory: upstream/build_dir
        run: node ../../scripts/apply-dsh-web-app-patch.mjs

      - name: Verify patch and source-built CLI
        shell: bash
        working-directory: upstream/build_dir
        run: |
          set -euo pipefail
          grep -q 'DSH_PKG_ALLOW_LAN' node_modules/@deepseek-ai/dsh-web-app/lib/startup.js
          test -f node_modules/@deepseek-ai/dsh/lib/bin.js
          test -f node_modules/.bin/dsh

      - name: Cleanup unnecessary files
        shell: bash
        working-directory: upstream/build_dir
        run: |
          find node_modules -type f \( -name '*.map' -o -name '*.ts' -o -name '*.mts' \) -delete || true
          find node_modules -type d \( -name test -o -name tests -o -name benchmark -o -name example -o -name demo \) -exec rm -rf {} + || true

      - name: Create archive
        shell: bash
        working-directory: upstream/build_dir
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ../../${{ matrix.artifact_name }} node_modules package.json patches
          else
            zip -r ../../${{ matrix.artifact_name }} node_modules package.json patches
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dsh-src-${{ inputs.dsh_version || github.event.inputs.dsh_version }}-${{ github.run_id }}
          name: Pre-release-dsh-${{ inputs.dsh_version || github.event.inputs.dsh_version }}
          body: |
            # DeepSeek Harness source pre-release
            - Version: ${{ inputs.dsh_version || github.event.inputs.dsh_version }}
            - Build ID: ${{ github.run_id }}
            - Built from upstream GitHub Release source because npm did not yet publish this version.
            - 使用说明见仓库 README.md
          draft: false
          prerelease: true
          files: |
            ./artifacts/**/*.zip
