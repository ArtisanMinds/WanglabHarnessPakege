name: Build and Release DeepSeek Harness

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '要打包的 dsh 版本 (例如: 0.1.2-rc.1 或 latest)'
        required: true
        default: '0.1.2-rc.1'
      allow_large_artifacts:
        description: '跳过体积预算（仅在确认体积来源后使用，例如上游把 LibreOfficeKit 引擎作为硬依赖引入）'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      dsh_version:
        description: '要打包的 dsh 版本 (例如: 0.1.2-rc.1 或 latest)'
        required: true
        type: string
      # 复用型 workflow 不会自动继承调用方的 input，必须显式声明，
      # 否则 sync-release.yml 传进来的 allow_large_artifacts 会被静默忽略。
      allow_large_artifacts:
        description: '跳过体积预算'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # 与 release job 同理：卡住的步骤不该一直占着 runner 直到 6 小时默认上限。
    timeout-minutes: 45
    strategy:
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: deepseek-harness-pkg-windows.zip
          - os: macos-latest
            artifact_name: deepseek-harness-pkg-macos-arm64.zip
          - os: macos-15-intel
            artifact_name: deepseek-harness-pkg-macos-x64.zip
          - os: ubuntu-latest
            artifact_name: deepseek-harness-pkg-linux.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 必须与 desktop 捆绑运行时保持一致（src-tauri/src/config/constants.rs 的 NODE_VERSION）。
          # 原生依赖（如 fs-ext）会在构建期编译，ABI 只匹配同一大版本的运行时。
          node-version: 22.22.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Pin dsh version and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm add "@deepseek-ai/dsh@${{ inputs.dsh_version || github.event.inputs.dsh_version }}" --save-exact
          pnpm install

      - name: Deploy package
        shell: bash
        run: |
          set -euo pipefail
          pnpm deploy --filter . --prod build_dir --legacy
          cd build_dir
          npm install --omit=dev

      - name: Report deploy footprint
        shell: bash
        # build_dir 此时是 deploy 后的真实内容。这一步只报告、不删除，用于回答
        # “体积膨胀来自哪个依赖”——保留项很大而可回收项很小，说明原因不在
        # 瘦身规则（例如交叉平台的 node-pty / sharp 原生二进制被打进了每个平台包）。
        run: node scripts/prune-node-modules.mjs --report-only --dir=build_dir/node_modules --list-dir=test --list-dir=__tests__

      - name: Apply dsh-web-app patch
        shell: bash
        working-directory: build_dir
        run: |
          node ../scripts/apply-dsh-web-app-patch.mjs

      - name: Verify patch applied
        shell: bash
        working-directory: build_dir
        run: |
          grep -q 'DSH_PKG_ALLOW_LAN' node_modules/@deepseek-ai/dsh-web-app/lib/startup.js && echo "patch OK" || (echo "patch missing" && exit 1)

      - name: Prune node_modules
        shell: bash
        working-directory: build_dir
        # 统一瘦身逻辑收敛到脚本里（跨平台支持），同时打印删除前后的体积构成。
        run: node ../scripts/prune-node-modules.mjs --dir=node_modules

      - name: Create archive
        shell: bash
        working-directory: build_dir
        run: |
          # 根据不同平台使用对应的压缩命令
          # 注意：patches 目录已随 799ce3ba 移除（dsh-web-app 补丁改为
          # scripts/apply-dsh-web-app-patch.mjs 直接打进 node_modules），
          # 不能再列入打包清单——7z 对缺失路径返回非零退出码会导致 Windows
          # 打包失败（zip 仅告警，这也是此前只有 Windows 失败的原因）。
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ../${{ matrix.artifact_name }} node_modules package.json package-lock.json
          else
            zip -r ../${{ matrix.artifact_name }} node_modules package.json package-lock.json
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    # 上传通道退化时 step 会挂着不动（见本文件顶部说明）。旧配置没有超时，
    # 卡住的上传会一直占着 runner 直到 6 小时默认上限，白烧额度。
    timeout-minutes: 20
    env:
      TAG: dsh-${{ inputs.dsh_version || github.event.inputs.dsh_version }}-${{ github.run_id }}
      DSH_VERSION: ${{ inputs.dsh_version || github.event.inputs.dsh_version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Check artifact size budget
        # 体积闸门：超预算直接失败并打印构成，避免下次膨胀又悄悄溜过去、
        # 把退化通道上的上传推成超时。先和上一个已发布版本对比，让膨胀趋势
        # （alpha.1 的 ~156 MiB -> alpha.2 的 ~534 MiB）直接可见。
        if: ${{ inputs.allow_large_artifacts != true && github.event.inputs.allow_large_artifacts != 'true' }}
        run: |
          set -euo pipefail
          previous_tag="$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          if [ -n "$previous_tag" ]; then
            echo "当前已发布版本 ${previous_tag} 的资产体积:"
            gh release view "$previous_tag" --json assets \
              --jq '.assets[] | "  \(.size)  \(.name)"' || true
          else
            echo "没有可对比的历史版本"
          fi
          # npm 部署产物的历史基准是单包 ~37 MiB / 合计 ~156 MiB，这里按
          # 1.7x / 1.6x 标定，而不是按当前现状贴边设（贴边设会漏掉同类回归）。
          node scripts/check-artifact-size.mjs --dir=./artifacts --max-file-mib=64 --max-total-mib=256

      - name: Note skipped size budget
        if: ${{ inputs.allow_large_artifacts == true || github.event.inputs.allow_large_artifacts == 'true' }}
        run: |
          echo "::warning::allow_large_artifacts=true —— 已跳过体积预算检查" >&2
          echo "体积来源应已排查：node scripts/zip-footprint.mjs <产物.zip>"

      - name: Delete stale drafts for this version
        # 上一次尝试失败会留下半成品 draft；draft 没有 git ref，既不会被
        # `gh release list --exclude-pre-releases` 看到，也无法用 tag 查到，
        # 必须先清掉，重跑才干净。
        run: node scripts/delete-stale-drafts.mjs --prefix="dsh-${DSH_VERSION}-"

      - name: Create release
        run: |
          set -euo pipefail
          # 不指定 --target，保持与 softprops/action-gh-release 一致的行为
          # （新 tag 落在仓库默认分支上）。tag 一律新建：本次 run 的 tag 尚未
          # 创建，历史 draft 已被上一步删除，所以这里的 tag 不会冲突。
          release_url="$(gh release create "$TAG" \
            --title "Release-${DSH_VERSION}" \
            --notes "$(printf '%s\n' \
              '# DeepSeek Harness Desktop Packages' \
              "- Version: ${DSH_VERSION}" \
              "- Build ID: ${GITHUB_RUN_ID}" \
              '- 使用说明见仓库 README.md')")"
          echo "created release: $release_url"
          {
            echo "### Published release"
            echo
            echo "$release_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload assets one by one with retry
        # 串行上传 + 逐包重试，替代 softprops/action-gh-release 的并发上传。
        # 原因有二：
        #   1. 该 action 用 Promise.all 同时传全部资产，并把每个文件整体读进内存
        #      (softprops/action-gh-release#243)；4 条连接平分本已退化的带宽，
        #      每条都更容易卡到 undici 的 5 分钟响应头超时而整体失败。
        #   2. 失败后没有逐包续传，只能整轮重跑。
        # `gh release upload` 是流式单连接上传，且 --clobber 允许重跑覆盖。
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(./artifacts/**/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no assets found under ./artifacts; refusing to publish an empty release" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            attempt=1
            max_attempts=4
            until gh release upload "$TAG" "$asset" --clobber; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "upload failed after ${max_attempts} attempts: $asset" >&2
                exit 1
              fi
              delay=$((15 * attempt))
              echo "upload failed for $asset (attempt ${attempt}/${max_attempts}), retrying in ${delay}s" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
            echo "uploaded $asset"
          done

      - name: Verify release assets
        # 显式确认四个包都在，避免发布出残缺 release。
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.size)  \(.name)"'
          count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          expected=4
          if [ "$count" -lt "$expected" ]; then
            echo "expected ${expected} assets on ${TAG}, found ${count}" >&2
            exit 1
          fi
          echo "release ${TAG} is complete"
